[pytest]
pythonpath = .
# Só a suíte da base comum. Cada RPA tem um pacote chamado `src`, e os três não
# coexistem num mesmo processo Python — por isso cada suíte roda numa invocação
# separada do pytest:
#
#   .venv\Scripts\python -m pytest tests
#   .venv\Scripts\python -m pytest rpa1_captura/tests
#   .venv\Scripts\python -m pytest rpa2_validacao_apuracao/tests
#   .venv\Scripts\python -m pytest rpa3_contestacao_agi_ec/tests
#
# O `conftest.py` de cada RPA cuida do próprio `sys.path`.
testpaths = tests
python_files = test_*.py
addopts = -q
